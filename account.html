<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Особистий кабінет — Єгор Шатайло</title>
  <meta name="description" content="Особистий кабінет: ваші сольники, замовлення, профіль.">
  <meta name="robots" content="noindex">

  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="noise" aria-hidden="true"></div>
  <div class="cursor" id="cursor" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursorRing" aria-hidden="true"></div>

  <header class="header header--solid">
    <a href="/" class="header__logo" data-hover aria-label="Єгор Шатайло — на головну">
      <span class="logo-text">Єгор Шатайло</span>
    </a>
    <a href="/#solnyky" class="btn btn--ghost btn--sm header__cta" data-hover>До сольників</a>
  </header>

  <main class="legal legal--account">
    <section class="legal__hero">
      <div class="legal__inner">
        <a href="/" class="legal__back" data-hover>← На головну</a>
      </div>
    </section>

    <section class="legal__content">
      <div class="legal__inner" data-account-page></div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__grid">
      <div class="footer__brand">
        <span class="logo-text logo-text--lg">Єгор Шатайло</span>
        <p>Стендап. Сольники. Мерч.</p>
      </div>
      <nav class="footer__col" aria-label="Соцмережі">
        <h4>Соцмережі</h4>
        <a href="https://www.instagram.com/egorshatailo/" target="_blank" rel="noopener" data-hover>Instagram</a>
        <a href="https://twitter.com/shatailer" target="_blank" rel="noopener" data-hover>Twitter</a>
        <a href="https://www.youtube.com/results?search_query=%D1%94%D0%B3%D0%BE%D1%80+%D1%88%D0%B0%D1%82%D0%B0%D0%B9%D0%BB%D0%BE" target="_blank" rel="noopener" data-hover>YouTube</a>
      </nav>
      <nav class="footer__col" aria-label="Документи">
        <h4>Документи</h4>
        <a href="/dogovir-oferty" data-hover>Договір оферти</a>
        <a href="/privacy-policy" data-hover>Політика конфіденційності</a>
        <a href="/contact" data-hover>Контакти</a>
      </nav>
    </div>
    <div class="container footer__bottom">
      <p>© <span id="footerYear">2026</span> Єгор Шатайло. Концепт-редизайн — весь контент і відео належать <a href="https://shatailo.com/" target="_blank" rel="noopener" data-hover>shatailo.com</a></p>
    </div>
  </footer>

  <script src="/js/store.js"></script>
  <script src="/js/page.js"></script>
</body>
</html>
